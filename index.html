<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superball Keno</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <h1>🎰 SUPERBALL KENO</h1>

    <div class="meters">
        <div>Credits: <span id="credits">1000</span></div>
        <div>Bet: <span id="bet">1</span></div>
        <div>Win: <span id="win">0</span></div>
    </div>
</header>

<main>

<section class="paytable">
    <h2>PAYTABLE</h2>

    <table>
        <tr><td>10 Hits</td><td>5000</td></tr>
        <tr><td>9 Hits</td><td>1500</td></tr>
        <tr><td>8 Hits</td><td>300</td></tr>
        <tr><td>7 Hits</td><td>50</td></tr>
        <tr><td>6 Hits</td><td>8</td></tr>
        <tr><td>5 Hits</td><td>3</td></tr>
        <tr><td>4 Hits</td><td>1</td></tr>
    </table>
</section>

<section>

<div id="keno-grid"></div>

</section>

<section class="draw-panel">

<h2>Draw</h2>

<div id="drawn-balls"></div>

</section>

</main>

<footer>

<button id="quickPick">Quick Pick</button>

<button id="clear">Erase</button>

<button id="betDown">Bet -</button>

<button id="betUp">Bet +</button>

<button id="play">PLAY GAME</button>

</footer>

<script src="script.js"></script>

</body>
  </html>
