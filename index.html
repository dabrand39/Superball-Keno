<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Superball Keno V2</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top">

<h1>🎰 SUPERBALL KENO</h1>

<div class="meters">

<div class="meter">
<div class="label">CREDITS</div>
<div id="credits">1000</div>
</div>

<div class="meter">
<div class="label">BET</div>
<div id="bet">1</div>
</div>

<div class="meter">
<div class="label">WIN</div>
<div id="win">0</div>
</div>

</div>

</header>

<main>

<section id="keno-grid"></section>

<aside class="right">

<h2>DRAWN BALLS</h2>

<div id="drawn-balls"></div>

<div class="controls">

<button id="quickPick">Quick Pick</button>

<button id="clear">Erase</button>

<button id="betDown">Bet −</button>

<button id="betUp">Bet +</button>

<button id="play">🎰 PLAY GAME</button>

</div>

</aside>

</main>

<script src="script.js"></script>

</body>
  </html>
